<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>For Pavani ♡</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="sp"></canvas><div id="cd"></div><div id="cr"></div>
<button id="mu" title="Music" aria-label="Music">♪</button>
 
<section class="stage on" id="intro"><div class="orb"></div>
<p id="il"></p>
<h1 class="script glow hide" id="hn">Pavani</h1>
<div class="row hide" id="ib"><button class="btn" id="open">Open ♡</button></div>
</section>
 
<section class="stage" id="jy"><div class="jw"><header class="jh"><h2 class="script glow">Our Journey</h2><p class="jc"><b id="dn">0</b> days of us, and counting ♡</p></header><div class="th"><i id="tl"></i></div><div id="chs"></div><div class="jf"><button class="btn" id="jn">Continue to my promises ♡</button></div></div></section>
<div id="pt"></div><div id="mn"></div><div id="st"></div>
<section class="stage" id="pr">
<div class="card"><div class="in" id="cardin"><div class="num" id="pn"></div><div class="nm script glow" id="pnm"></div><p class="tx" id="ptx"></p></div></div>
<div class="dots" id="dots"></div>
<button class="btn" id="nx">I promise ♡</button>
</section>
 
<section class="stage" id="rg"><div class="rw"><div class="halo"></div><img class="rimg" src="promise.png" alt="Promise ring"><i class="sk" style="left:44%;top:30%;font-size:30px">✦</i><i class="sk" style="left:70%;top:55%;font-size:20px;animation-delay:.8s">✦</i><i class="sk" style="left:20%;top:60%;font-size:22px;animation-delay:1.5s">✦</i></div>
<h2 class="script glow" style="font-size:clamp(34px,7vw,56px)">One more promise ♡</h2><p class="tx" id="rt" style="max-width:560px"></p><button class="btn" id="rn">Open our certificate ♡</button></section>
<section class="stage" id="ce">
<h2 class="script glow" style="font-size:clamp(34px,7vw,56px)">Our promise, made official ♡</h2>
<canvas id="cv"></canvas>
<div class="row"><button class="btn" id="dl">Download certificate ♡</button><button class="btn" id="fnb">One last thing ♡</button><button class="btn s" id="rp">Read promises again</button></div>
<p class="note" id="nt">Always yours, Jeevan</p>
</section>
 
<section class="stage" id="fn"><div class="rays"></div><svg id="lo" viewBox="-120 -115 240 130"></svg>
<p id="fl"></p><h2 class="script gold hide" id="ft">Naa Mahalakshmi</h2><p class="note hide" id="fe" style="font-size:22px;opacity:1"></p>
<div class="row hide" id="fb"><button class="btn s" id="fr">Replay from the start ♡</button></div></section>
 
<script src="script.js"></script>
</body></html>
